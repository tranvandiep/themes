<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <link rel="icon" href="https://gozic.vn/uploads/stores/49/2026/03/icon-gozic.webp">
  <link rel="shortcut icon" href="https://gozic.vn/uploads/stores/49/2026/03/icon-gozic.webp">
  <link rel="canonical" href="https://gozic.vn" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            'clinic-blue': '#0284C7',
            'clinic-dark': '#0369A1',
            'clinic-teal': '#0EA5E9',
            'clinic-sky': '#F0F9FF',
            'clinic-emerald': '#10B981',
            'surface': '#FFFFFF',
            'surface-light': '#F8FAFC',
            'border-slate': '#E2E8F0',
            'text-main': '#0F172A',
            'text-muted': '#64748B'
          },
          fontFamily: {
            heading: ['Outfit', 'Plus Jakarta Sans', 'sans-serif'],
            sans: ['Plus Jakarta Sans', '-apple-system', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <script src="../../libs/theme-toolbar.js" data-theme-name="DentalCare Pro Clinic" defer></script>

  <title>Đặt Lịch Khám - DentalCare Mobile</title>
</head>
<body class="bg-surface-light text-text-main font-sans antialiased pb-20">

  <!-- Mobile Header -->
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-border-slate px-4 py-3">
    <div class="flex items-center justify-between">
      <a href="home.html" class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-clinic-blue text-white flex items-center justify-center font-bold">
          <span class="material-symbols-outlined text-xl">dentistry</span>
        </div>
        <span class="font-extrabold text-base tracking-tight text-text-main font-heading">DENTAL<span class="text-clinic-blue">CARE</span></span>
      </a>

      <div class="flex items-center gap-2">
        <a href="cart.html" class="relative p-2 text-text-main">
          <span class="material-symbols-outlined text-2xl">loyalty</span>
          <span class="absolute top-1 right-1 w-4 h-4 bg-clinic-blue text-white text-[9px] font-bold rounded-full flex items-center justify-center">1</span>
        </a>
        <a href="tel:19001899" class="p-2 text-clinic-blue">
          <span class="material-symbols-outlined text-2xl">call</span>
        </a>
      </div>
    </div>
  </header>


  <div class="p-4 bg-white border-b border-border-slate">
    <h1 class="text-lg font-extrabold text-text-main font-heading">Đặt Lịch Hẹn Khám Miễn Phí</h1>
    <p class="text-xs text-text-muted mt-0.5">Chụp CT 3D & Tư vấn cùng bác sĩ chuyên khoa</p>
  </div>

  <main class="p-4 space-y-4">
    <form class="bg-white p-4 rounded-xl border border-border-slate space-y-3">
      <div>
        <label class="block text-[11px] font-semibold text-text-muted mb-1">Họ Và Tên Bệnh Nhân *</label>
        <input type="text" placeholder="Nguyễn Thị Lan" class="w-full px-3 py-2 rounded-lg border border-border-slate text-xs outline-none" required />
      </div>
      <div>
        <label class="block text-[11px] font-semibold text-text-muted mb-1">Số Điện Thoại Nhận SMS *</label>
        <input type="tel" placeholder="0901 234 567" class="w-full px-3 py-2 rounded-lg border border-border-slate text-xs outline-none" required />
      </div>
      <div>
        <label class="block text-[11px] font-semibold text-text-muted mb-1">Dịch Vụ Cần Khám</label>
        <select class="w-full px-3 py-2 rounded-lg border border-border-slate text-xs outline-none">
          <option>Niềng răng Invisalign</option>
          <option>Bọc răng sứ thẩm mỹ</option>
          <option>Cấy ghép Implant</option>
          <option>Khám tổng quát / Nhổ răng khôn</option>
        </select>
      </div>
      <button type="submit" class="w-full py-2.5 bg-clinic-blue text-white font-bold rounded-lg text-xs shadow-md font-heading">
        Xác Nhận Lịch Hẹn
      </button>
    </form>

    <div class="bg-white p-4 rounded-xl border border-border-slate text-xs space-y-2">
      <p class="font-bold text-text-main font-heading">Hotline Hỗ Trợ 24/7:</p>
      <p class="font-mono text-clinic-blue font-bold">1900 1899 &bull; (028) 7300 1899</p>
      <p class="text-text-muted">128 Nguyễn Đình Chiểu, Quận 3, TP.HCM</p>
    </div>
  </main>


  <!-- Mobile Bottom Nav -->
  <nav class="fixed bottom-0 left-0 right-0 z-40 bg-white/95 backdrop-blur-lg border-t border-border-slate py-2 px-4 flex items-center justify-around shadow-lg">
    <a href="home.html" class="flex flex-col items-center gap-1 text-clinic-blue">
      <span class="material-symbols-outlined text-2xl">home</span>
      <span class="text-[10px] font-bold">Trang Chủ</span>
    </a>
    <a href="category.html" class="flex flex-col items-center gap-1 text-text-muted hover:text-clinic-blue">
      <span class="material-symbols-outlined text-2xl">medical_services</span>
      <span class="text-[10px] font-medium">Dịch Vụ</span>
    </a>
    <a href="detail.html" class="flex flex-col items-center gap-1 text-text-muted hover:text-clinic-blue">
      <span class="material-symbols-outlined text-2xl">verified</span>
      <span class="text-[10px] font-medium">Invisalign</span>
    </a>
    <a href="news.html" class="flex flex-col items-center gap-1 text-text-muted hover:text-clinic-blue">
      <span class="material-symbols-outlined text-2xl">article</span>
      <span class="text-[10px] font-medium">Cẩm Nang</span>
    </a>
    <a href="contact.html" class="flex flex-col items-center gap-1 text-text-muted hover:text-clinic-blue">
      <span class="material-symbols-outlined text-2xl">calendar_month</span>
      <span class="text-[10px] font-medium">Đặt Hẹn</span>
    </a>
  </nav>

</body>
</html>
