<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <link rel="icon" href="https://gozic.vn/uploads/stores/49/2026/03/icon-gozic.webp">
  <link rel="shortcut icon" href="https://gozic.vn/uploads/stores/49/2026/03/icon-gozic.webp">
  <link rel="canonical" href="https://gozic.vn" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            'clinic-blue': '#0284C7',
            'clinic-dark': '#0369A1',
            'clinic-teal': '#0EA5E9',
            'clinic-sky': '#F0F9FF',
            'clinic-emerald': '#10B981',
            'surface': '#FFFFFF',
            'surface-light': '#F8FAFC',
            'border-slate': '#E2E8F0',
            'text-main': '#0F172A',
            'text-muted': '#64748B'
          },
          fontFamily: {
            heading: ['Outfit', 'Plus Jakarta Sans', 'sans-serif'],
            sans: ['Plus Jakarta Sans', '-apple-system', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <script src="../../libs/theme-toolbar.js" data-theme-name="DentalCare Pro Clinic" defer></script>

  <title>Phiếu Cọc - DentalCare Mobile</title>
</head>
<body class="bg-surface-light text-text-main font-sans antialiased pb-24">

  <!-- Mobile Header -->
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-border-slate px-4 py-3">
    <div class="flex items-center justify-between">
      <a href="home.html" class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-clinic-blue text-white flex items-center justify-center font-bold">
          <span class="material-symbols-outlined text-xl">dentistry</span>
        </div>
        <span class="font-extrabold text-base tracking-tight text-text-main font-heading">DENTAL<span class="text-clinic-blue">CARE</span></span>
      </a>

      <div class="flex items-center gap-2">
        <a href="cart.html" class="relative p-2 text-text-main">
          <span class="material-symbols-outlined text-2xl">loyalty</span>
          <span class="absolute top-1 right-1 w-4 h-4 bg-clinic-blue text-white text-[9px] font-bold rounded-full flex items-center justify-center">1</span>
        </a>
        <a href="tel:19001899" class="p-2 text-clinic-blue">
          <span class="material-symbols-outlined text-2xl">call</span>
        </a>
      </div>
    </div>
  </header>


  <div class="p-4 bg-white border-b border-border-slate">
    <h1 class="text-lg font-extrabold text-text-main font-heading">Phiếu Cọc Ưu Đãi</h1>
    <p class="text-xs text-text-muted mt-0.5">Giữ ưu đãi giảm 10 triệu đồng</p>
  </div>

  <main class="p-4 space-y-3">
    <div class="bg-white p-4 rounded-xl border border-border-slate space-y-2">
      <div class="flex justify-between items-start">
        <div>
          <h2 class="font-bold text-xs text-text-main font-heading">Niềng Răng Trong Suốt Invisalign</h2>
          <span class="text-[10px] text-text-muted">Tặng gói tẩy trắng răng</span>
        </div>
        <span class="font-bold text-xs text-clinic-blue font-heading">2.000.000₫</span>
      </div>
    </div>

    <div class="bg-white p-4 rounded-xl border border-border-slate space-y-2 text-xs">
      <div class="flex justify-between text-text-muted">
        <span>Chi phí trọn gói:</span>
        <span class="font-mono">35.000.000₫</span>
      </div>
      <div class="flex justify-between font-bold text-text-main pt-2 border-t border-border-slate text-sm font-heading">
        <span>Tiền cọc giữ chỗ:</span>
        <span class="text-clinic-blue">2.000.000₫</span>
      </div>
    </div>
  </main>

  <div class="fixed bottom-0 left-0 right-0 z-50 bg-white border-t border-border-slate p-3 shadow-lg">
    <a href="contact.html" class="block w-full py-3 bg-clinic-blue text-white font-bold text-center rounded-xl text-xs shadow-md font-heading">
      Xác Nhận Đặt Cọc
    </a>
  </div>
</body>
</html>
