<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <link rel="icon" href="https://gozic.vn/uploads/stores/49/2026/03/icon-gozic.webp">
  <link rel="shortcut icon" href="https://gozic.vn/uploads/stores/49/2026/03/icon-gozic.webp">
  <link rel="canonical" href="https://gozic.vn" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            'primary': '#8E3E50',
            'primary-hover': '#753040',
            'primary-container': '#471622',
            'rose-gold': '#D9826C',
            'rose-light': '#FDF4F2',
            'champagne': '#C9A86A',
            'champagne-light': '#FAF5EB',
            'surface': '#FFFFFF',
            'surface-warm': '#FAF7F5',
            'charcoal': '#1E191B',
            'charcoal-muted': '#6B5E62',
            'border-subtle': '#EFE6E1',
            'border-accent': '#E5C9C1'
          },
          fontFamily: {
            heading: ['Playfair Display', 'Plus Jakarta Sans', 'serif'],
            sans: ['Be Vietnam Pro', '-apple-system', 'sans-serif'],
            display: ['Playfair Display', 'serif']
          }
        }
      }
    }
  </script>
  <script src="../../libs/theme-toolbar.js" data-theme-name="Aura Pure Cosmetics" defer></script>

  <title>Liên Hệ &amp; Soi Da - Aura Pure</title>
</head>
<body class="bg-surface font-sans text-charcoal antialiased">
  
    <header class="fixed top-0 left-0 w-full z-50 bg-white/95 backdrop-blur-md border-b border-border-subtle shadow-sm">
      <div class="h-14 px-4 flex items-center justify-between gap-3">
        <div class="flex items-center gap-2.5 min-w-0">
          
      <a href="home.html" class="w-10 h-10 flex items-center justify-center rounded-full text-charcoal hover:bg-surface-warm">
        <span class="material-symbols-outlined text-2xl">arrow_back</span>
      </a>
    
          <div class="min-w-0">
            <h1 class="font-heading text-lg font-bold text-primary truncate leading-tight">Liên Hệ Showroom</h1>
            <p class="text-[10px] text-charcoal-muted uppercase tracking-wider">Aura Pure Skincare</p>
          </div>
        </div>
        <div class="flex items-center gap-1.5 shrink-0">
          <a href="category.html" class="w-9 h-9 flex items-center justify-center text-charcoal rounded-full hover:bg-surface-warm">
            <span class="material-symbols-outlined text-xl">search</span>
          </a>
          <a href="cart.html" class="relative w-9 h-9 flex items-center justify-center text-charcoal rounded-full hover:bg-surface-warm">
            <span class="material-symbols-outlined text-xl">shopping_bag</span>
            <span class="absolute top-1 right-1 w-4 h-4 rounded-full bg-primary text-white text-[10px] flex items-center justify-center font-bold">3</span>
          </a>
        </div>
      </div>
    </header>
    

  <main class="pt-16 pb-20 px-4 space-y-5">
    <div class="p-5 rounded-2xl bg-gradient-to-br from-rose-light to-champagne-light border border-border-accent text-center">
      <span class="material-symbols-outlined text-primary text-3xl mb-1">event_available</span>
      <h2 class="font-heading text-lg font-bold text-primary-container">Đặt Hẹn Soi Da Miễn Phí</h2>
      <p class="text-xs text-charcoal-muted mt-1 mb-4">Nhận quà tặng mini kit 150k tại Showroom.</p>

      <form class="space-y-3 text-xs text-left">
        <div>
          <label class="block font-semibold mb-1">Họ và tên *</label>
          <input type="text" placeholder="Nguyễn Minh Thư" class="w-full px-3 py-2.5 rounded-xl bg-white border border-border-subtle focus:outline-none" />
        </div>
        <div>
          <label class="block font-semibold mb-1">Số điện thoại *</label>
          <input type="tel" placeholder="0988 888 xxx" class="w-full px-3 py-2.5 rounded-xl bg-white border border-border-subtle focus:outline-none" />
        </div>
        <div>
          <label class="block font-semibold mb-1">Chi nhánh gần bạn</label>
          <select class="w-full px-3 py-2.5 rounded-xl bg-white border border-border-subtle focus:outline-none">
            <option>Hà Nội: 88 Phố Huế, Hoàn Kiếm</option>
            <option>TP.HCM: 168 Nguyễn Huệ, Quận 1</option>
            <option>Đà Nẵng: 45 Bạch Đằng, Hải Châu</option>
          </select>
        </div>
        <button type="button" class="w-full py-3 bg-primary text-white font-bold rounded-xl shadow-md">
          Gửi Yêu Cầu Hẹn
        </button>
      </form>
    </div>

    <!-- Hotline -->
    <div class="p-4 rounded-2xl bg-surface-warm border border-border-subtle flex items-center gap-3">
      <span class="material-symbols-outlined text-primary text-2xl">call</span>
      <div>
        <div class="text-[11px] text-gray-400">Hotline tư vấn da liễu:</div>
        <div class="font-bold text-sm text-primary">1900 6868 (8:00 - 21:30)</div>
      </div>
    </div>
  </main>

  
    <nav class="fixed bottom-0 left-0 w-full z-50 bg-white/95 backdrop-blur-md border-t border-border-subtle shadow-[0_-2px_10px_rgba(0,0,0,0.05)] pb-safe">
      <div class="h-14 px-2 flex items-center justify-around">
        
        <a href="home.html" class="flex flex-col items-center justify-center min-w-[56px] h-11 text-center text-charcoal-muted hover:text-primary">
          <div class="relative">
            <span class="material-symbols-outlined text-2xl">home</span>
            
          </div>
          <span class="text-[10px] mt-0.5">Trang chủ</span>
        </a>
        
        <a href="category.html" class="flex flex-col items-center justify-center min-w-[56px] h-11 text-center text-charcoal-muted hover:text-primary">
          <div class="relative">
            <span class="material-symbols-outlined text-2xl">spa</span>
            
          </div>
          <span class="text-[10px] mt-0.5">Sản phẩm</span>
        </a>
        
        <a href="news.html" class="flex flex-col items-center justify-center min-w-[56px] h-11 text-center text-charcoal-muted hover:text-primary">
          <div class="relative">
            <span class="material-symbols-outlined text-2xl">article</span>
            
          </div>
          <span class="text-[10px] mt-0.5">Cẩm nang</span>
        </a>
        
        <a href="cart.html" class="flex flex-col items-center justify-center min-w-[56px] h-11 text-center text-charcoal-muted hover:text-primary">
          <div class="relative">
            <span class="material-symbols-outlined text-2xl">shopping_bag</span>
            <span class="absolute -top-1 -right-2 px-1.5 h-4 min-w-[16px] rounded-full bg-primary text-white text-[10px] flex items-center justify-center font-bold">3</span>
          </div>
          <span class="text-[10px] mt-0.5">Giỏ hàng</span>
        </a>
        
        <a href="contact.html" class="flex flex-col items-center justify-center min-w-[56px] h-11 text-center text-primary font-bold">
          <div class="relative">
            <span class="material-symbols-outlined text-2xl">storefront</span>
            
          </div>
          <span class="text-[10px] mt-0.5">Liên hệ</span>
        </a>
        
      </div>
    </nav>
    
</body>
</html>
