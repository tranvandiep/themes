<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <link rel="icon" href="https://gozic.vn/uploads/stores/49/2026/03/icon-gozic.webp">
  <link rel="shortcut icon" href="https://gozic.vn/uploads/stores/49/2026/03/icon-gozic.webp">
  <link rel="canonical" href="https://gozic.vn" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            'primary': '#8C4A26',
            'primary-hover': '#72381B',
            'primary-container': '#1C120C',
            'amber-gold': '#D98A3D',
            'warm-ivory': '#FAF6F0',
            'surface': '#FFFFFF',
            'charcoal': '#1F1A17',
            'charcoal-muted': '#6B5F57',
            'border-subtle': '#EDE5DD'
          },
          fontFamily: {
            heading: ['Playfair Display', 'Plus Jakarta Sans', 'serif'],
            sans: ['Be Vietnam Pro', '-apple-system', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <script src="../../libs/theme-toolbar.js" data-theme-name="Gourmet Bistro &amp; Cafe" defer></script>

  <title>Chi Tiết Món Ăn - Gourmet Bistro</title>
</head>
<body class="bg-surface font-sans text-charcoal antialiased">
  
    <header class="fixed top-0 left-0 w-full z-50 bg-white/95 backdrop-blur-md border-b border-border-subtle shadow-sm">
      <div class="h-14 px-4 flex items-center justify-between gap-3">
        <div class="flex items-center gap-2.5 min-w-0">
          
      <a href="category.html" class="w-10 h-10 flex items-center justify-center rounded-full text-charcoal hover:bg-warm-ivory">
        <span class="material-symbols-outlined text-2xl">arrow_back</span>
      </a>
    
          <div class="min-w-0">
            <h1 class="font-heading text-lg font-bold text-primary truncate leading-tight">Chi Tiết Món Ăn</h1>
            <p class="text-[10px] text-charcoal-muted uppercase tracking-wider">Restaurant &amp; Cafe</p>
          </div>
        </div>
        <div class="flex items-center gap-2 shrink-0">
          <a href="contact.html" class="px-3 py-1.5 rounded-full bg-primary text-white text-xs font-semibold">
            Đặt Bàn
          </a>
          <a href="cart.html" class="relative w-8 h-8 flex items-center justify-center text-charcoal">
            <span class="material-symbols-outlined text-xl">shopping_bag</span>
            <span class="absolute top-0 right-0 w-3.5 h-3.5 rounded-full bg-amber-gold text-white text-[9px] flex items-center justify-center font-bold">2</span>
          </a>
        </div>
      </div>
    </header>
    
  <main class="pt-16 pb-24 px-4 space-y-4">
    <img src="https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=800&q=80" alt="Wagyu" class="w-full h-56 object-cover rounded-2xl shadow-md" />
    <h2 class="font-heading text-xl font-bold text-primary">Bò Wagyu Nướng Đá Muối Himalaya (250g)</h2>
    <div class="text-lg font-bold text-amber-gold">890.000 đ <span class="text-xs line-through text-gray-400">1.200.000 đ</span></div>
    <p class="text-xs text-charcoal-muted leading-relaxed">
      Nướng trực tiếp trên phiến đá muối hồng nung nóng 300 độ C, giữ trọn vị mềm mọng tự nhiên.
    </p>
  </main>
  <div class="fixed bottom-0 left-0 w-full z-50 bg-white border-t border-border-subtle p-3 px-4 flex items-center justify-between shadow-2xl">
    <span class="text-base font-bold text-primary">890.000 đ</span>
    <a href="contact.html" class="px-6 py-2.5 bg-primary text-white font-bold text-xs rounded-xl">Đặt Bàn Thưởng Thức</a>
  </div>
</body>
</html>
