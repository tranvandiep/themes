<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <link rel="icon" href="https://gozic.vn/uploads/stores/49/2026/03/icon-gozic.webp">

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            'primary': '#8C4A26',
            'primary-hover': '#72381B',
            'primary-container': '#1C120C',
            'amber-gold': '#D98A3D',
            'warm-ivory': '#FAF6F0',
            'surface': '#FFFFFF',
            'charcoal': '#1F1A17',
            'charcoal-muted': '#6B5F57',
            'border-subtle': '#EDE5DD'
          },
          fontFamily: {
            heading: ['Playfair Display', 'Plus Jakarta Sans', 'serif'],
            sans: ['Be Vietnam Pro', '-apple-system', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <script src="../../libs/theme-toolbar.js" data-theme-name="Gourmet Bistro &amp; Cafe" defer></script>

  <title>Menu Món Ăn - Gourmet Bistro</title>

<body class="bg-surface font-sans text-charcoal antialiased">
  
    <header class="fixed top-0 left-0 w-full z-50 bg-white/95 backdrop-blur-md border-b border-border-subtle shadow-sm">
      <div class="h-14 px-4 flex items-center justify-between gap-3">
        <div class="flex items-center gap-2.5 min-w-0">
          
      <a href="home.html" class="w-10 h-10 flex items-center justify-center rounded-full text-charcoal hover:bg-warm-ivory">
        <span class="material-symbols-outlined text-2xl">arrow_back</span>
      </a>
    
          <div class="min-w-0">

          </div>
        </div>
        <div class="flex items-center gap-2 shrink-0">
          <a href="contact.html" class="px-3 py-1.5 rounded-full bg-primary text-white text-xs font-semibold">
            Đặt Bàn
          </a>
          <a href="cart.html" class="relative w-8 h-8 flex items-center justify-center text-charcoal">
            <span class="material-symbols-outlined text-xl">shopping_bag</span>

          </a>
        </div>

    <div class="bg-warm-ivory p-3 rounded-2xl border border-border-subtle flex gap-3">
      <img src="https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=800&q=80" alt="Steak" class="w-20 h-20 object-cover rounded-xl shrink-0" />
      <div>
        <h4 class="font-bold text-xs text-primary">Bò Wagyu Nướng Đá Muối</h4>

        <a href="detail.html" class="text-[11px] text-primary font-semibold underline">Chi tiết ›</a>
      </div>
    </div>
    <div class="bg-warm-ivory p-3 rounded-2xl border border-border-subtle flex gap-3">
      <img src="https://images.unsplash.com/photo-1621996346565-e3d5d6281292?auto=format&fit=crop&w=800&q=80" alt="Pasta" class="w-20 h-20 object-cover rounded-xl shrink-0" />
      <div>
        <h4 class="font-bold text-xs text-primary">Mỳ Ý Tôm Hùm Truffle</h4>
        <div class="text-xs font-bold text-amber-gold my-1">550.000 đ</div>
        <a href="detail.html" class="text-[11px] text-primary font-semibold underline">Chi tiết ›</a>
      </div>
    </div>

        <a href="home.html" class="flex flex-col items-center justify-center min-w-[56px] h-11 text-center text-charcoal-muted hover:text-primary">
          <span class="material-symbols-outlined text-2xl">home</span>
          <span class="text-[10px] mt-0.5">Trang chủ</span>
        </a>
        
        <a href="category.html" class="flex flex-col items-center justify-center min-w-[56px] h-11 text-center text-primary font-bold">

        </a>
        
        <a href="news.html" class="flex flex-col items-center justify-center min-w-[56px] h-11 text-center text-charcoal-muted hover:text-primary">

          <span class="text-[10px] mt-0.5">Cẩm nang</span>
        </a>
        
        <a href="cart.html" class="flex flex-col items-center justify-center min-w-[56px] h-11 text-center text-charcoal-muted hover:text-primary">
          <span class="material-symbols-outlined text-2xl">shopping_bag</span>
          <span class="text-[10px] mt-0.5">Món đặt</span>
        </a>
        
        <a href="contact.html" class="flex flex-col items-center justify-center min-w-[56px] h-11 text-center text-charcoal-muted hover:text-primary">
          <span class="material-symbols-outlined text-2xl">table_restaurant</span>
          <span class="text-[10px] mt-0.5">Đặt bàn</span>
        </a>
