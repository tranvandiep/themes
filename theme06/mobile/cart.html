<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <link rel="icon" href="https://gozic.vn/uploads/stores/49/2026/03/icon-gozic.webp">
  <link rel="shortcut icon" href="https://gozic.vn/uploads/stores/49/2026/03/icon-gozic.webp">
  <link rel="canonical" href="https://gozic.vn" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            'tech-dark': '#0B132B',
            'tech-navy': '#1C2541',
            'tech-blue': '#3A506B',
            'cyan-accent': '#00E5FF',
            'cyan-light': '#E0FBFC',
            'brand-blue': '#2563EB',
            'surface': '#FFFFFF',
            'surface-slate': '#F8FAFC',
            'border-slate': '#E2E8F0',
            'text-main': '#0F172A',
            'text-muted': '#64748B'
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', '-apple-system', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
  <script src="../../libs/theme-toolbar.js" data-theme-name="Nexus Cloud Enterprise" defer></script>

  <title>Giỏ Hàng Đăng Ký - Nexus Cloud Mobile</title>
</head>
<body class="bg-surface-slate text-text-main font-sans antialiased pb-24">

  <!-- Mobile Header -->
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-border-slate px-4 py-3">
    <div class="flex items-center justify-between">
      <a href="home.html" class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-tech-dark text-cyan-accent flex items-center justify-center font-bold">
          <span class="material-symbols-outlined text-xl">hub</span>
        </div>
        <span class="font-extrabold text-base tracking-tight text-tech-dark">NEXUS<span class="text-brand-blue">CLOUD</span></span>
      </a>

      <div class="flex items-center gap-2">
        <a href="cart.html" class="relative p-2 text-text-main">
          <span class="material-symbols-outlined text-2xl">shopping_cart</span>
          <span class="absolute top-1 right-1 w-4 h-4 bg-brand-blue text-white text-[9px] font-bold rounded-full flex items-center justify-center">2</span>
        </a>
        <a href="contact.html" class="p-2 text-text-main">
          <span class="material-symbols-outlined text-2xl">support_agent</span>
        </a>
      </div>
    </div>
  </header>


  <div class="p-4 bg-white border-b border-border-slate">
    <h1 class="text-lg font-extrabold text-tech-dark">Đơn Đăng Ký Thuê Bao</h1>
    <p class="text-xs text-text-muted mt-0.5">2 dịch vụ đang chờ kích hoạt</p>
  </div>

  <main class="p-4 space-y-3">
    <div class="bg-white p-4 rounded-xl border border-border-slate space-y-2">
      <div class="flex justify-between items-start">
        <div>
          <h2 class="font-bold text-xs text-tech-dark">Nexus Cloud VPS Pro</h2>
          <span class="text-[10px] text-text-muted">12 Tháng (Giảm 15%)</span>
        </div>
        <span class="font-mono font-bold text-xs text-brand-blue">15.000.000₫</span>
      </div>
    </div>

    <div class="bg-white p-4 rounded-xl border border-border-slate space-y-2">
      <div class="flex justify-between items-start">
        <div>
          <h2 class="font-bold text-xs text-tech-dark">Nexus Shield WAF Basic</h2>
          <span class="text-[10px] text-text-muted">12 Tháng</span>
        </div>
        <span class="font-mono font-bold text-xs text-brand-blue">6.000.000₫</span>
      </div>
    </div>

    <div class="bg-white p-4 rounded-xl border border-border-slate space-y-2 text-xs">
      <div class="flex justify-between text-text-muted">
        <span>Tổng chi phí:</span>
        <span class="font-mono">21.000.000₫</span>
      </div>
      <div class="flex justify-between text-green-600 font-semibold">
        <span>Ưu đãi năm:</span>
        <span class="font-mono">- 3.150.000₫</span>
      </div>
      <div class="flex justify-between font-bold text-tech-dark pt-2 border-t border-border-slate text-sm">
        <span>Thanh toán:</span>
        <span class="font-mono text-brand-blue">19.635.000₫</span>
      </div>
    </div>
  </main>

  <div class="fixed bottom-0 left-0 right-0 z-50 bg-white border-t border-border-slate p-3 shadow-lg">
    <a href="contact.html" class="block w-full py-3 bg-brand-blue text-white font-bold text-center rounded-xl text-xs shadow-md">
      Xuất Hóa Đơn & Kích Hoạt
    </a>
  </div>
</body>
</html>
