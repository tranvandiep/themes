<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <link rel="icon" href="https://gozic.vn/uploads/stores/49/2026/03/icon-gozic.webp">
  <link rel="shortcut icon" href="https://gozic.vn/uploads/stores/49/2026/03/icon-gozic.webp">
  <link rel="canonical" href="https://gozic.vn" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            'tech-dark': '#0B132B',
            'tech-navy': '#1C2541',
            'tech-blue': '#3A506B',
            'cyan-accent': '#00E5FF',
            'cyan-light': '#E0FBFC',
            'brand-blue': '#2563EB',
            'surface': '#FFFFFF',
            'surface-slate': '#F8FAFC',
            'border-slate': '#E2E8F0',
            'text-main': '#0F172A',
            'text-muted': '#64748B'
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', '-apple-system', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
  <script src="../../libs/theme-toolbar.js" data-theme-name="Nexus Cloud Enterprise" defer></script>

  <title>Liên Hệ Tư Vấn - Nexus Cloud Mobile</title>
</head>
<body class="bg-surface-slate text-text-main font-sans antialiased pb-20">

  <!-- Mobile Header -->
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-border-slate px-4 py-3">
    <div class="flex items-center justify-between">
      <a href="home.html" class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-tech-dark text-cyan-accent flex items-center justify-center font-bold">
          <span class="material-symbols-outlined text-xl">hub</span>
        </div>
        <span class="font-extrabold text-base tracking-tight text-tech-dark">NEXUS<span class="text-brand-blue">CLOUD</span></span>
      </a>

      <div class="flex items-center gap-2">
        <a href="cart.html" class="relative p-2 text-text-main">
          <span class="material-symbols-outlined text-2xl">shopping_cart</span>
          <span class="absolute top-1 right-1 w-4 h-4 bg-brand-blue text-white text-[9px] font-bold rounded-full flex items-center justify-center">2</span>
        </a>
        <a href="contact.html" class="p-2 text-text-main">
          <span class="material-symbols-outlined text-2xl">support_agent</span>
        </a>
      </div>
    </div>
  </header>


  <div class="p-4 bg-white border-b border-border-slate">
    <h1 class="text-lg font-extrabold text-tech-dark">Liên Hệ Tư Vấn & Báo Giá</h1>
    <p class="text-xs text-text-muted mt-0.5">Hỗ trợ kỹ thuật SLA 99.99% 24/7</p>
  </div>

  <main class="p-4 space-y-4">
    <form class="bg-white p-4 rounded-xl border border-border-slate space-y-3">
      <div>
        <label class="block text-[11px] font-semibold text-text-muted mb-1">Họ Và Tên *</label>
        <input type="text" placeholder="Nguyễn Văn A" class="w-full px-3 py-2 rounded-lg border border-border-slate text-xs outline-none" required />
      </div>
      <div>
        <label class="block text-[11px] font-semibold text-text-muted mb-1">Số Điện Thoại *</label>
        <input type="tel" placeholder="0901 234 567" class="w-full px-3 py-2 rounded-lg border border-border-slate text-xs outline-none" required />
      </div>
      <div>
        <label class="block text-[11px] font-semibold text-text-muted mb-1">Email Công Ty *</label>
        <input type="email" placeholder="name@company.com" class="w-full px-3 py-2 rounded-lg border border-border-slate text-xs outline-none" required />
      </div>
      <div>
        <label class="block text-[11px] font-semibold text-text-muted mb-1">Dịch Vụ Cần Dùng</label>
        <select class="w-full px-3 py-2 rounded-lg border border-border-slate text-xs outline-none">
          <option>Nexus Cloud VPS Pro</option>
          <option>Nexus Shield WAF DDoS</option>
          <option>Enterprise ERP Suite</option>
        </select>
      </div>
      <button type="submit" class="w-full py-2.5 bg-brand-blue text-white font-bold rounded-lg text-xs shadow-md">
        Gửi Yêu Cầu Tư Vấn
      </button>
    </form>

    <div class="bg-white p-4 rounded-xl border border-border-slate text-xs space-y-2">
      <p class="font-bold text-tech-dark">Tổng Đài Hỗ Trợ Kỹ Thuật:</p>
      <p class="font-mono text-brand-blue font-bold">1900 6889 &bull; Phục vụ 24/7</p>
      <p class="text-text-muted">Tòa tháp Nexus Tower, Khu Công Nghệ Cao, TP.HCM</p>
    </div>
  </main>


  <!-- Mobile Bottom Nav -->
  <nav class="fixed bottom-0 left-0 right-0 z-40 bg-white/95 backdrop-blur-lg border-t border-border-slate py-2 px-4 flex items-center justify-around shadow-lg">
    <a href="home.html" class="flex flex-col items-center gap-1 text-brand-blue">
      <span class="material-symbols-outlined text-2xl">home</span>
      <span class="text-[10px] font-semibold">Trang Chủ</span>
    </a>
    <a href="category.html" class="flex flex-col items-center gap-1 text-text-muted hover:text-brand-blue">
      <span class="material-symbols-outlined text-2xl">grid_view</span>
      <span class="text-[10px] font-medium">Giải Pháp</span>
    </a>
    <a href="detail.html" class="flex flex-col items-center gap-1 text-text-muted hover:text-brand-blue">
      <span class="material-symbols-outlined text-2xl">layers</span>
      <span class="text-[10px] font-medium">Gói Cước</span>
    </a>
    <a href="news.html" class="flex flex-col items-center gap-1 text-text-muted hover:text-brand-blue">
      <span class="material-symbols-outlined text-2xl">article</span>
      <span class="text-[10px] font-medium">Tin Tức</span>
    </a>
    <a href="contact.html" class="flex flex-col items-center gap-1 text-text-muted hover:text-brand-blue">
      <span class="material-symbols-outlined text-2xl">mail</span>
      <span class="text-[10px] font-medium">Tư Vấn</span>
    </a>
  </nav>

</body>
</html>
